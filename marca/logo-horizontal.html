<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logo · Cuidado em Movimento</title>
<!-- Folha de marca: abra no navegador para ver as versões do logotipo. Os SVGs desta pasta são os arquivos-mestre (vetor). -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@700&display=block" rel="stylesheet">
<style>
body{margin:0;background:#EFE8DC;font-family:Manrope,sans-serif;padding:32px;display:grid;gap:24px;grid-template-columns:1fr 1fr}
.c{border-radius:20px;padding:48px;display:flex;align-items:center;justify-content:center}.claro{background:#FFF6E9}.escuro{background:#102B4C}.c.full{grid-column:1/-1}
.lk{display:flex;align-items:center;gap:22px}.lk img{width:150px}.dv{width:2.5px;align-self:stretch;margin:12px 0;background:#E9A52B;border-radius:2px}
.nm{position:relative;font-family:'DM Serif Display';font-size:58px;line-height:.95;color:#102B4C;padding-bottom:16px;white-space:nowrap}.nm em{color:#8A5A0B}
.escuro .nm{color:#FFF6E9}.escuro .nm em{color:#E9A52B}.nm svg{position:absolute;left:0;bottom:0;width:108%;height:10px}
.tg{margin-top:14px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#4A5B70}.escuro .tg{color:#C9D3DF}
.ic{display:flex;gap:24px}.ic img{width:140px}
</style></head><body>
<div class="c claro full"><div class="lk"><img src="simbolo-azul.svg" alt=""><span class="dv"></span><div><div class="nm">Cuidado<br><em>em</em> Movimento<svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M2 8C60 2 140 1 198 6 140 4 70 5 2 8Z" fill="#E9A52B"/></svg></div><div class="tg">Mais que transporte, uma companhia em todas as ocasiões.</div></div></div></div>
<div class="c escuro"><div class="lk"><img src="simbolo-creme.svg" alt="" style="width:110px"><span class="dv"></span><div class="nm" style="font-size:44px">Cuidado<br><em>em</em> Movimento<svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M2 8C60 2 140 1 198 6 140 4 70 5 2 8Z" fill="#E9A52B"/></svg></div></div></div>
<div class="c claro"><div class="ic"><img src="avatar-azul.svg" alt=""><img src="avatar-dourado.svg" alt=""></div></div>
</body></html>
